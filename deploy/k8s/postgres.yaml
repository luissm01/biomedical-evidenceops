# Single PostgreSQL + pgvector instance with a persistent volume. Not HA (D038).
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: evidenceops
spec:
  selector: {app: postgres}
  ports:
    - {name: postgres, port: 5432, targetPort: 5432}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: evidenceops
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:0.8.7-pg18-trixie
          env:
            - {name: POSTGRES_DB, value: evidenceops}
            - {name: POSTGRES_USER, value: evidenceops}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-credentials, key: POSTGRES_PASSWORD}
          ports:
            - {name: postgres, containerPort: 5432}
          readinessProbe:
            exec:
              command: [pg_isready, -U, evidenceops, -d, evidenceops]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [pg_isready, -U, evidenceops, -d, evidenceops]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 2Gi}
