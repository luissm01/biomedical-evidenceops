apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: evidenceops
spec:
  selector: {app: api}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: evidenceops
spec:
  # Two replicas to observe rotation; the rate limit is per process, so the
  # effective limit per key is replicas x capacity (D037, D038).
  replicas: 2
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api
          image: evidenceops:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: evidenceops-config}
            - secretRef: {name: evidenceops-secrets}
          ports:
            - {name: http, containerPort: 8000}
          # Keep serving while the endpoint removal propagates to Traefik;
          # without it, deleted/rolled pods still receive a few requests (502).
          lifecycle:
            preStop:
              sleep: {seconds: 5}
          # Imports and the first DB connection happen before /health answers.
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 2
            failureThreshold: 30
          # Liveness never checks PostgreSQL: a DB outage must not restart the API.
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness checks PostgreSQL and the Alembic head: 503 removes the pod
          # from the Service endpoints until the dependency recovers.
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 2
          # Measured idle RSS ~105 MiB (cgroup memory.peak); limit leaves headroom
          # for request bursts. The medcpt extra is not in the image (D038).
          resources:
            requests: {cpu: 100m, memory: 160Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
