[project]
name = "evidenceops"
version = "0.1.0"
description = "Plataforma de inteligencia sobre evidencia biomédica pública"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "google-genai>=2.23.0",
    "httpx>=0.28.1",
    "opentelemetry-sdk>=1.38.0",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "prometheus-client>=0.25.0",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
    "pgvector>=0.4.2",
]

[project.scripts]
evidenceops = "evidenceops:main"

[project.optional-dependencies]
medcpt = [
    "torch>=2.10",
    "transformers>=4.57,<5",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
