[project]
name = "evidenceops"
version = "0.1.0"
description = "Plataforma de inteligencia sobre evidencia biomédica pública"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "uvicorn>=0.52.4",
]

[project.scripts]
evidenceops = "evidenceops:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
]
