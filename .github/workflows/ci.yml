name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EVIDENCEOPS_DATABASE_URL: postgresql+psycopg://evidenceops@localhost:5432/evidenceops_test
      EVIDENCEOPS_TEST_DATABASE_URL: postgresql+psycopg://evidenceops@localhost:5432/evidenceops_test

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: evidenceops_test
          POSTGRES_USER: evidenceops
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evidenceops -d evidenceops_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"
          enable-cache: false

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Apply database migrations
        run: uv run --locked alembic upgrade head

      - name: Run tests
        run: uv run --locked pytest
